<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MinuteMetrics</title>
    <link rel="stylesheet" href="static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topline" aria-live="polite">
        <div>
          <p class="label" id="range">Loading</p>
          <h1 id="title">MinuteMetrics</h1>
        </div>
        <div class="dashboard-actions">
          <label class="competition-select-label">
            <span>Competition</span>
            <select id="competitionSelect"></select>
          </label>
          <button class="icon-button" id="refresh" type="button" aria-label="Refresh">
            <span aria-hidden="true">&#8635;</span>
          </button>
        </div>
      </section>

      <section class="leader-band">
        <div>
          <p class="label">Leader</p>
          <div class="leader-name" id="leaderName">Waiting for sync</div>
        </div>
        <div class="margin">
          <p class="label">Margin</p>
          <strong id="margin">0 min</strong>
        </div>
      </section>

      <section class="participants" id="participants"></section>

      <section class="empty-state" id="emptyState" hidden>
        <div>
          <p class="label">Ready To Sync</p>
          <h2>No exercise minutes yet</h2>
          <p>
            The dashboard will fill in as soon as the first phone uploads Health data.
          </p>
        </div>
        <div class="empty-steps">
          <div>
            <span>1</span>
            <p>Pair iPhone</p>
          </div>
          <div>
            <span>2</span>
            <p>Full Sync</p>
          </div>
          <div>
            <span>3</span>
            <p>Watch standings</p>
          </div>
        </div>
      </section>

      <section class="panel projection-panel">
        <div class="panel-head">
          <h2>Projected Minutes</h2>
        </div>
        <div class="projection-wrap" id="projectionChart"></div>
        <div class="projection-legend" id="projectionLegend"></div>
      </section>

      <section class="analytics">
        <div class="panel">
          <div class="panel-head">
            <h2>Last 14 Days</h2>
          </div>
          <div class="bars" id="bars"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Daily Movers</h2>
          </div>
          <div class="heatmap" id="heatmap"></div>
        </div>
      </section>
    </main>

    <template id="participantTemplate">
      <article class="participant">
        <div class="participant-layout">
          <div class="participant-main">
            <span class="swatch"></span>
            <div>
              <h2 class="participant-name"></h2>
              <p class="sync"></p>
              <div class="total"></div>
            </div>
          </div>
          <div>
            <dl class="stats">
              <div>
                <dt>Today</dt>
                <dd class="today"></dd>
              </div>
              <div>
                <dt>Daily Avg</dt>
                <dd class="average"></dd>
              </div>
            </dl>
          </div>
        </div>
      </article>
    </template>

    <script src="static/app.js"></script>
  </body>
</html>
