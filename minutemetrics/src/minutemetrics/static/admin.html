<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MinuteMetrics Admin</title>
    <link rel="stylesheet" href="static/styles.css">
  </head>
  <body>
    <main class="shell admin-shell">
      <section class="topline">
        <div>
          <p class="label">MinuteMetrics</p>
          <h1>Admin</h1>
        </div>
        <a class="secondary-button" href="dashboard">Dashboard</a>
      </section>

      <section class="panel admin-gate" id="adminGate">
        <div class="panel-head">
          <h2>Access</h2>
        </div>
        <form class="admin-form token-form" id="tokenForm">
          <label>
            <span>Admin token</span>
            <input id="adminToken" name="adminToken" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button" type="submit">Unlock</button>
        </form>
      </section>

      <section class="admin-workspace" id="adminWorkspace" hidden>
        <p class="admin-status" id="adminStatus"></p>
        <div id="adminView"></div>
        <section class="panel admin-footer">
          <button class="secondary-button" id="clearAdminToken" type="button">Clear Admin Token</button>
          <button class="danger-button" id="clearData" type="button">Clear Sync Data</button>
        </section>
      </section>
    </main>

    <dialog class="pairing-dialog" id="pairingDialog">
      <div class="pairing-head">
        <div>
          <p class="label">Pair iPhone</p>
          <h2 id="pairingTitle">Scan QR Code</h2>
        </div>
        <button class="icon-button" id="closePairing" type="button" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="qr-frame" id="qrFrame"></div>
      <div class="pairing-fields">
        <label>
          <span>Server URL</span>
          <span class="pairing-copy-row">
            <input id="pairingServerUrl" type="text" readonly>
            <button class="secondary-button" id="copyPairingServerUrl" type="button">Copy</button>
          </span>
        </label>
        <label>
          <span>Sync token</span>
          <span class="pairing-copy-row">
            <input id="pairingSyncToken" type="password" readonly>
            <button class="secondary-button" id="copyPairingSyncToken" type="button">Copy</button>
          </span>
        </label>
        <p class="pairing-copy-status" id="pairingCopyStatus" aria-live="polite"></p>
      </div>
      <p class="pairing-note">Open MinuteMetrics on the iPhone and scan this code to save the server URL and sync token.</p>
    </dialog>

    <script src="static/admin.js"></script>
  </body>
</html>
