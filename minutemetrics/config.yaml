---
name: MinuteMetrics
version: "0.2.10"
slug: minutemetrics
description: Apple Health exercise-minute competition tracker
url: https://github.com/kmcrandom/minutemetrics-ha
image: ghcr.io/kmcrandom/minutemetrics-ha
arch:
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8080
panel_title: MinuteMetrics
panel_icon: mdi:chart-line
stage: experimental
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: MinuteMetrics API and dashboard
options:
  auth:
    admin_token: change-me-before-use
    dashboard_token: ""
  database:
    path: /data/minutemetrics.sqlite
  dashboard:
    theme: system
  home_assistant:
    publish_entities: true
    publish_method: rest
  network:
    server_url: ""
schema:
  auth:
    admin_token: password
    dashboard_token: password?
  database:
    path: str
  dashboard:
    theme: list(system|light|dark)
  home_assistant:
    publish_entities: bool
    publish_method: list(rest|disabled)
  network:
    server_url: str?
