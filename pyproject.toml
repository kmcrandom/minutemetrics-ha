[project]
name = "minutemetrics"
version = "0.2.10"
description = "Apple Health exercise-minute competition service for Home Assistant."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "pydantic>=2.7.0",
  "qrcode>=8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["minutemetrics/src"]

[tool.setuptools.package-data]
minutemetrics = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["minutemetrics/src"]
testpaths = ["tests"]
